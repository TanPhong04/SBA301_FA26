<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Library Management - Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
        }
        h2 {
            text-align: center;
            color: #1c1e21;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .form-group { margin-bottom: 15px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #4b4f56;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            border-color: #1877f2;
            outline: none;
            box-shadow: 0 0 0 2px #e7f3ff;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-login:hover { background-color: #166fe5; }
        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #8a8d91;
        }
    </style>
</head>
<body>
<div class="login-card">
    <h2>LIBRARY MANAGEMENT</h2>
    <form th:action="@{/loginForm}" method="post" novalidate>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="txtEmail" placeholder="Enter your email"
                   required title="Vui lòng nhập email hợp lệ">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="txtPassword" placeholder="Enter your password"
                   required minlength="6" title="Password phải có ít nhất 6 ký tự">
        </div>
        <!-- Thông báo lỗi từ server khi login thất bại -->
        <div th:if="${error}"
             style="background:#f8d7da; border:1px solid #f5c6cb; color:#721c24;
                    padding:8px 12px; border-radius:4px; font-size:13px; margin-bottom:10px; text-align:center;">
            ⚠ <span th:text="${error}"></span>
        </div>
        <button type="submit" class="btn-login">Login</button>
    </form>
    <div class="footer-text">
        SBA301 - Lab 08: Spring Boot & MongoDB
    </div>
</div>
</body>
</html>
