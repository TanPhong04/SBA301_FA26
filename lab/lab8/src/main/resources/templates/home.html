<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Library Management</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #007bff; color: white; }
        tr:hover { background: #f5f5f5; cursor: pointer; }
        .form-grid { display: grid; grid-template-columns: 110px 1fr; gap: 8px; margin-top: 20px; max-width: 500px; align-items: center; }
        .btn { padding: 8px 15px; border: none; border-radius: 4px; color: white; cursor: pointer; }
        .btn-add { background: #28a745; } .btn-up { background: #ffc107; color: black; } .btn-del { background: #dc3545; }
        /* Validation styles */
        .field-error { color: #dc3545; font-size: 12px; grid-column: 2; margin-top: -4px; }
        input.is-invalid { border: 1px solid #dc3545; background: #fff5f5; }
        .alert-danger { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24;
                        padding: 10px 15px; border-radius: 4px; margin-top: 15px; font-size: 14px; }
    </style>
    <script>
        function selectStudent(id, email, pass, fname, lname, mark) {
            document.getElementById('id').value = id;
            document.getElementById('email').value = email;
            document.getElementById('password').value = pass;
            document.getElementById('firstName').value = fname;
            document.getElementById('lastName').value = lname;
            document.getElementById('marks').value = mark;
        }
        function clearForm() {
            document.getElementById('id').value = '0';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('firstName').value = '';
            document.getElementById('lastName').value = '';
            document.getElementById('marks').value = '';
        }
    </script>
</head>
<body>
<div class="card">
    <h2>Student List <a th:href="@{/logout}" style="float:right; font-size:14px;">Logout</a></h2>
    <table>
        <thead>
        <tr>
            <th>ID</th><th>Email</th><th>First Name</th><th>Last Name</th><th>Marks</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${studentList}"
            th:onclick="selectStudent([[${s.id}]], [[${s.email}]], [[${s.password}]], [[${s.firstName}]], [[${s.lastName}]], [[${s.marks}]])"
            style="cursor:pointer">
            <td th:text="${s.id}"></td>
            <td th:text="${s.email}"></td>
            <td th:text="${s.firstName}"></td>
            <td th:text="${s.lastName}"></td>
            <td th:text="${s.marks}"></td>
        </tr>
        </tbody>
    </table>


    <form th:action="@{/manageStudent}" method="post" th:object="${student}">
        <!-- ID ẩn: bằng 0 khi thêm mới (để service tự động lấy max + 1) -->
        <input type="hidden" th:field="*{id}">

        <!-- Hiển thị tóm tắt tất cả lỗi nếu có (phải nằm trong th:object) -->
        <div class="alert-danger" th:if="${#fields.hasErrors('*')}">
            <strong>⚠ Vui lòng kiểm tra lại:</strong>
            <ul style="margin:5px 0 0 20px; padding:0;">
                <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
            </ul>
        </div>

        <div class="form-grid">            <label>Email:</label>
            <input type="text" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

            <label>Password:</label>
            <input type="password" th:field="*{password}"
                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
            <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>

            <label>First Name:</label>
            <input type="text" th:field="*{firstName}"
                   th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'">
            <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>

            <label>Last Name:</label>
            <input type="text" th:field="*{lastName}"
                   th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'">
            <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>

            <label>Marks (0–10):</label>
            <input type="number" th:field="*{marks}" min="0" max="10"
                   th:classappend="${#fields.hasErrors('marks')} ? 'is-invalid'">
            <span class="field-error" th:if="${#fields.hasErrors('marks')}" th:errors="*{marks}"></span>
        </div>

        <div style="margin-top: 20px; display: flex; gap: 10px; align-items: center;">
            <button type="submit" name="btnManageStudent" value="add"    class="btn btn-add">➕ Add</button>
            <button type="submit" name="btnManageStudent" value="update" class="btn btn-up">✏️ Update</button>
            <button type="submit" name="btnManageStudent" value="delete" class="btn btn-del">🗑 Delete</button>
            <button type="button" onclick="clearForm()" style="padding:8px 15px; border-radius:4px; cursor:pointer;">🔄 Clear</button>
        </div>
    </form>
</div>
</body>
</html>
